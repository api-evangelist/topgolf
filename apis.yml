aid: topgolf
name: Topgolf Callaway Brands
description: >-
  Topgolf Callaway Brands is a Carlsbad, California–headquartered modern golf
  and active lifestyle company, formerly Callaway Golf Company, that rebranded
  in August 2022 following its 2020 acquisition of Topgolf for approximately
  $2 billion. The company operates across three reportable segments: Topgolf
  entertainment venues, Golf Equipment (Callaway and Odyssey clubs and balls),
  and Active Lifestyle (TravisMathew, Jack Wolfskin, OGIO, and Callaway
  apparel and gear). Adjacent technology offerings include Toptracer, the
  ball-tracing platform powering over 1,200 driving ranges globally and used
  as the official ball-tracing partner for major broadcasters including NBC,
  CBS, Golf Channel, and Sky Sports, as well as Toptracer Range, Toptracer
  Go, and Topgolf Swing Suite golf simulation. In September 2024 the company
  announced plans to separate Topgolf into a standalone publicly traded
  company by late 2025, with Callaway retaining a minority stake and
  remaining its official golf equipment supplier. The company does not
  publish a public developer API, OpenAPI specification, partner SDK, or
  open-source library across any of its consumer or facility-operator
  surfaces. The TopGolf GitHub organization (github.com/TopGolf) contains
  only generic internal infrastructure tooling — RabbitMQ wrappers, Docker
  logging drivers, Ansible roles, AWS WAF templates, a Lyft iOS SDK fork —
  with no Topgolf-, Callaway-, or Toptracer-branded APIs, clients, or
  schemas. Toptracer facility integrations and Topgolf venue partnerships
  are handled through private commercial agreements rather than a self-serve
  developer program.
